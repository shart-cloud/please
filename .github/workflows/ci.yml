name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Feature 004 made `plz` a two-configuration build. A lint job that only ever sees the default one
      # never reads a line of the judgement tier's CLI wiring, so `-D warnings` would be enforced on half
      # the code that ships.
      - run: cargo clippy --workspace --all-targets --features please-cli/judge -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--no-fail-fast`, and it is not a style preference. Cargo stops after the first test *target*
      # that fails, so while `please-core --test fixtures` is red — the false-positive rate is under
      # SC-003's threshold with 17 of the required 200 benign cases — every target sorting after it is
      # never executed: preparation, ruleset_load, sanitize, scaling, scan, score, seams,
      # no_self_steering. Eight binaries, silently, including the FR-020 security properties.
      #
      # The failing suite still fails the job. The difference is that the run now says what else is
      # broken instead of stopping at the first thing.
      - run: cargo test --workspace --no-fail-fast
      # Same reasoning as clippy above: the tier's own tests — the adversarial property test, the
      # fail-closed suite, credential resolution — are only compiled when the feature is on. The
      # offline ones are the majority and they are where the security properties live.
      - run: cargo test --workspace --features please-cli/judge --no-fail-fast

  # Principle V's embeddability claim is only worth what proves it. This job IS that proof: the core
  # must build for a target with no filesystem, no network, no threads, and no monotonic clock. It is
  # not a portability nicety — a failure here means the constitution's central promise is broken.
  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p please-core --target wasm32-unknown-unknown

  # The eval harness is excluded from the workspace on purpose (plan.md D12), which means
  # `cargo test --workspace` never touches it and it could rot unnoticed. This builds it separately so
  # the exclusion costs isolation, not correctness.
  eval-isolated:
    name: eval crate (out of workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --manifest-path crates/eval/Cargo.toml

  # FR-106. The built-in fast path skips compiled resource validation at default limits, on the grounds
  # that this check has already established it. Everything about that shortcut — a ~489 µs cold start
  # instead of ~5.75 ms — rests on this job existing.
  #
  # It is its own job rather than a line in `test` deliberately. In 001 the expensive validation tier was
  # never invoked by anything, on any rule set, including the embedded one, and the fast path's safety
  # therefore rested on nothing at all. A guarantee that a whole design decision depends on should be a
  # check you can point at and watch go red, not a test whose absence would look like a passing suite.
  #
  # If this fails, `Engine::builtin()` is returning an unvalidated scanner and the fix is the rule set,
  # not this job.
  builtin-validation:
    name: built-in rule set validates (FR-106)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo test -p please-core --test preparation
          the_builtin_rule_set_passes_compiled_validation_at_default_limits
          -- --exact --nocapture

  # Principle V has two halves and needs two checks. The allow-list covers a *dependency* reaching the
  # network or the filesystem; the isolation check covers the engine's own code doing it, which an
  # allow-list is blind to because `std::net` needs no dependency at all.
  boundaries:
    name: dependency and isolation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./ci/check-dependencies.sh
      - run: ./ci/check-core-isolation.sh
      # Feature 004, FR-419/SC-405. The two checks above have only ever covered `please-core`, which was
      # sufficient while the CLI had no optional capability — the judgement tier gives it one, and
      # Principle V requires the gating be enforced by a check rather than by review.
      #
      # This one asserts in three directions: the default `plz` graph matches its allow-list exactly, it
      # contains no HTTP or TLS crate by name, and `--features judge` DOES contain them. The third is
      # what stops the whole job passing trivially the day the feature flag breaks.
      - run: ./ci/check-cli-dependencies.sh

  # SC-404 / FR-413. Its own job because it runs the whole suite with canary credentials in the
  # environment, which is not something to fold into a job people read as "lint".
  #
  # The natural way to write an error includes the thing that failed, and the body of a 401 can echo a
  # token. Catching that by review works on the day someone is looking for it.
  credential-leak:
    name: no credential in any output (SC-404)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./ci/check-no-credential-leak.sh

  # SC-005 and SC-004a (001 T087/T093, the growth-exponent half of T095).
  #
  # Its own job, and `--release`, for one reason: `cargo test --workspace` runs a debug build, where an
  # unoptimised regex engine puts throughput below a megabyte a second. An absolute figure measured there
  # is not a weaker signal, it is a meaningless one — so the tests are `#[cfg_attr(debug_assertions,
  # ignore)]` and appear in the main suite as ignored, which is visible, rather than absent.
  #
  # What each assertion is worth is argued in `crates/core/tests/scaling.rs`. Briefly: the growth exponent
  # is scale-free and holds on any machine; the 4 KB latency bound has a fourteen-fold margin; and the
  # throughput assertion is a regression floor rather than the criterion, because **SC-004a's 10 MB/s is
  # not currently met** — measured ~6.5 MB/s, recorded in `docs/limits.md`. If that is ever fixed, the
  # floor in that file becomes 10.0 and this comment goes away.
  performance:
    name: scaling and throughput (SC-004a, SC-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--nocapture` so the measurements land in the run log. A regression that trips the floor is worth
      # a number in the job output, not just an assertion message.
      - run: cargo test --release -p please-core --test scaling -- --nocapture --test-threads=1

# Jobs arriving with later tasks, listed so their absence is deliberate rather than forgotten:
#
#   T095  per-change fuzz smoke (SC-006). The benchmark half of this task landed as `performance` above.
#   T096  scheduled fuzz campaign accumulating past 1M inputs (separate workflow, self-hosted).
#   T109  MSRV verification against the pinned floor.
