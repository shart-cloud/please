[package]
name = "please-cli"
description = "plz — scan prompts, skills, and artifacts for prompt-injection attempts."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["security", "prompt-injection", "cli", "llm", "agent"]
categories = ["command-line-utilities", "text-processing"]

# The binary is `plz`, not `please`.
#
# `pleaser` — a sudo alternative with ~50k downloads — already installs a binary called `please`.
# Colliding with it would be bad on PATH and worse semantically: `please <command>` currently means
# "run this with elevated privileges", and a prompt-injection scanner borrowing that verb invites the
# wrong mental model. If a pre-tool hook shells out to `please`, whichever binary is first on PATH
# wins, and a firewall that silently is not running is a bad failure mode.
[[bin]]
name = "plz"
path = "src/main.rs"

# ── Features ────────────────────────────────────────────────────────────────────────────────────
#
# `judge` is the only optional capability, and it is now ON by default. It was not, and the reversal is
# deliberate: a tier nobody can reach without recompiling is a tier nobody evaluates, and the second opinion
# is the part of this tool that resolves what the structural tier provably cannot (docs/limits.md, "Displayed
# payloads in tool output cannot be told from live ones").
#
# What that costs is honest and worth stating. Enabling it links `ureq` and a `rustls` stack — about 28
# crates — into a tool whose central promise is that it needs neither. Three things keep the promise
# meaningful anyway:
#
#   * the tier is still inert unless `--judge` is passed. A default scan makes no request, resolves no
#     credential, and opens no socket. What changed is what is COMPILED, not what runs.
#   * `--no-default-features` still produces the no-network binary, and please-core is untouched either way:
#     ci/check-dependencies.sh still pins it at 27 crates and the wasm32 build still proves it.
#   * every failure of the tier is a coverage gap and therefore `Inconclusive`, never `Clean` (FR-402).
#
# Until this commit, ci/check-cli-dependencies.sh asserted the default graph carried no HTTP or TLS crate.
# That check is deleted rather than inverted — see the commit message. The no-network build is still
# buildable and no longer machine-proven, which is a real thing to have given up.
[features]
default = ["judge"]
judge = ["dep:please-judge"]

[dependencies]
# `serde` is enabled here rather than in the core's defaults: machine-readable output is a CLI
# concern, and the core stays serialisation-free for wasm and embedded callers.
please-core = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde_json = { workspace = true }
# Still `optional` and still `dep:`-gated above, so no implicit feature of the same name exists and
# `--no-default-features` drops it entirely. What changed is that `default` now asks for it.
please-judge = { workspace = true, optional = true }

[dev-dependencies]
# Snapshot tests for human-readable output, and a scratch tree for directory-walk tests including the
# unreadable-target case (FR-032a).
insta = { workspace = true }
# Validating `--format json` against contracts/verdict.schema.json (001 T065). The schema is a PUBLISHED
# contract and had drifted from the type for two features before anything checked it — a second,
# hand-rolled implementation of the same rules could drift the same way, so this validates the real file.
#
# A dev-dependency only, and a heavy one. Dev-dependencies never reach a shipped binary, so this cannot
# affect what `plz` links. `default-features = false` drops the resolver's network fetching for remote
# `$ref`s, which this schema does not use and which a security tool has no business performing.
jsonschema = { version = "0.49", default-features = false }
serde_json = { workspace = true }
tempfile = { workspace = true }
