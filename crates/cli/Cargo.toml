[package]
name = "please-cli"
description = "plz — scan prompts, skills, and artifacts for prompt-injection attempts."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["security", "prompt-injection", "cli", "llm", "agent"]
categories = ["command-line-utilities", "text-processing"]

# The binary is `plz`, not `please`.
#
# `pleaser` — a sudo alternative with ~50k downloads — already installs a binary called `please`.
# Colliding with it would be bad on PATH and worse semantically: `please <command>` currently means
# "run this with elevated privileges", and a prompt-injection scanner borrowing that verb invites the
# wrong mental model. If a pre-tool hook shells out to `please`, whichever binary is first on PATH
# wins, and a firewall that silently is not running is a bad failure mode.
[[bin]]
name = "plz"
path = "src/main.rs"

# ── Features ────────────────────────────────────────────────────────────────────────────────────
#
# `judge` is the ONLY optional capability and it is deliberately not in `default`. Enabling it links an
# HTTP client and a TLS stack into a tool whose central promise is that it needs neither, so it must be a
# decision someone makes rather than one they inherit (plan D8, FR-401).
#
# The gating is enforced by ci/check-cli-dependencies.sh, not by this comment: the default graph is pinned
# by exact name, and the script also asserts the INVERSE — that `--features judge` does pull the client —
# because a feature that silently stopped working would otherwise sail through an absence-only check.
[features]
default = []
judge = ["dep:please-judge"]

[dependencies]
# `serde` is enabled here rather than in the core's defaults: machine-readable output is a CLI
# concern, and the core stays serialisation-free for wasm and embedded callers.
please-core = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde_json = { workspace = true }
# Optional, and `dep:`-gated above so no implicit feature of the same name exists. The edge from `plz` to
# the judgement tier is the one place the default build must not have (plan D1).
please-judge = { workspace = true, optional = true }

[dev-dependencies]
# Snapshot tests for human-readable output, and a scratch tree for directory-walk tests including the
# unreadable-target case (FR-032a).
insta = { workspace = true }
# Validating `--format json` against contracts/verdict.schema.json (001 T065). The schema is a PUBLISHED
# contract and had drifted from the type for two features before anything checked it — a second,
# hand-rolled implementation of the same rules could drift the same way, so this validates the real file.
#
# A dev-dependency only, and a heavy one. `ci/check-cli-dependencies.sh` inspects `cargo tree --edges
# normal`, which excludes dev-dependencies, so it cannot reach the default `plz` graph that Principle V
# constrains. `default-features = false` drops the resolver's network fetching for remote `$ref`s, which
# this schema does not use and which a security tool has no business performing.
jsonschema = { version = "0.49", default-features = false }
serde_json = { workspace = true }
tempfile = { workspace = true }
